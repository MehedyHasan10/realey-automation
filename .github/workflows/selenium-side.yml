name: Realey Footer Selenium Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "tests/**"
      - ".github/workflows/selenium-side.yml"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  footer-tests:
    name: Run Footer Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. Confirm the .side file exists
      - name: Verify SIDE test file
        shell: bash
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f -print

          if [ ! -f "tests/realey-footer.side" ]; then
            echo "ERROR: tests/realey-footer.side was not found."
            exit 1
          fi

          echo "SIDE file found successfully."

      # 4. Install matching Chrome and ChromeDriver
      - name: Set up Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      # 5. Confirm Chrome and ChromeDriver versions
      - name: Verify Chrome and ChromeDriver
        shell: bash
        run: |
          CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          CHROMEDRIVER_PATH="${{ steps.setup-chrome.outputs.chromedriver-path }}"

          echo "Chrome path: $CHROME_PATH"
          echo "ChromeDriver path: $CHROMEDRIVER_PATH"

          "$CHROME_PATH" --version
          "$CHROMEDRIVER_PATH" --version

      # 6. Install only Selenium SIDE Runner
      #
      # Do not install the npm chromedriver package here.
      - name: Install Selenium SIDE Runner
        shell: bash
        run: |
          npm init -y
          npm install --save-dev selenium-side-runner

          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version

          echo "Selenium SIDE Runner version:"
          npx selenium-side-runner --version || true

      # 7. Create report folders
      - name: Create report folders
        shell: bash
        run: |
          mkdir -p test-results
          mkdir -p html-report

      # 8. Run the Selenium IDE project
      #
      # continue-on-error allows the workflow to generate and upload
      # the HTML report even when a footer test fails.
      - name: Run Selenium SIDE tests
        id: selenium
        continue-on-error: true
        shell: bash
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          set +e

          # ChromeDriver must be available in PATH.
          export PATH="$(dirname "$CHROMEDRIVER_PATH"):$PWD/node_modules/.bin:$PATH"

          echo "========================================"
          echo "Starting Realey footer Selenium tests"
          echo "SIDE file: tests/realey-footer.side"
          echo "Chrome: $CHROME_PATH"
          echo "ChromeDriver: $CHROMEDRIVER_PATH"
          echo "========================================"

          "$CHROME_PATH" --version
          "$CHROMEDRIVER_PATH" --version

          xvfb-run -a npx selenium-side-runner \
            -w 1 \
            -c "browserName=chrome goog:chromeOptions.binary='$CHROME_PATH' goog:chromeOptions.args=[headless,no-sandbox,disable-dev-shm-usage,window-size=1920,1080]" \
            "tests/realey-footer.side" \
            2>&1 | tee test-results/selenium-console.log

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          echo "$TEST_EXIT_CODE" > test-results/exit-code.txt

          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "PASSED" > test-results/status.txt
            echo "All Selenium tests passed."
          else
            echo "FAILED" > test-results/status.txt
            echo "One or more Selenium tests failed."
          fi

          echo "Selenium exit code: $TEST_EXIT_CODE"

          exit "$TEST_EXIT_CODE"

      # 9. Show test result inside GitHub Actions logs
      - name: Display Selenium result
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "SELENIUM TEST RESULT"
          echo "========================================"

          if [ -f "test-results/status.txt" ]; then
            echo "Status: $(cat test-results/status.txt)"
          else
            echo "Status: ERROR"
            echo "No status file was created."
          fi

          if [ -f "test-results/exit-code.txt" ]; then
            echo "Exit code: $(cat test-results/exit-code.txt)"
          fi

          echo ""
          echo "Console output:"
          echo "----------------------------------------"

          if [ -f "test-results/selenium-console.log" ]; then
            cat test-results/selenium-console.log
          else
            echo "No Selenium console log was generated."
          fi

      # 10. Generate browser-friendly HTML report
      - name: Generate HTML report
        if: always()
        shell: bash
        run: |
          python3 <<'PYTHON'
          from datetime import datetime, timezone
          from pathlib import Path
          import html
          import re

          results_dir = Path("test-results")
          report_dir = Path("html-report")

          report_dir.mkdir(parents=True, exist_ok=True)

          status_file = results_dir / "status.txt"
          exit_code_file = results_dir / "exit-code.txt"
          log_file = results_dir / "selenium-console.log"

          status = (
              status_file.read_text(encoding="utf-8").strip()
              if status_file.exists()
              else "ERROR"
          )

          exit_code = (
              exit_code_file.read_text(encoding="utf-8").strip()
              if exit_code_file.exists()
              else "Unknown"
          )

          console_log = (
              log_file.read_text(
                  encoding="utf-8",
                  errors="replace"
              )
              if log_file.exists()
              else "No Selenium console output was generated."
          )

          # Remove terminal ANSI colour codes.
          ansi_escape = re.compile(
              r"\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])"
          )

          clean_log = ansi_escape.sub("", console_log)

          # Read Selenium SIDE Runner's Jest summary.
          tests_match = re.search(
              r"Tests:\s+"
              r"(?:(\d+)\s+failed,\s+)?"
              r"(?:(\d+)\s+passed,\s+)?"
              r"(\d+)\s+total",
              clean_log,
              flags=re.IGNORECASE,
          )

          suites_match = re.search(
              r"Test Suites:\s+"
              r"(?:(\d+)\s+failed,\s+)?"
              r"(?:(\d+)\s+passed,\s+)?"
              r"(\d+)\s+total",
              clean_log,
              flags=re.IGNORECASE,
          )

          if tests_match:
              failed_count = int(tests_match.group(1) or 0)
              passed_count = int(tests_match.group(2) or 0)
              total_count = int(tests_match.group(3) or 0)
          else:
              passed_count = 1 if status == "PASSED" else 0
              failed_count = 0 if status == "PASSED" else 1
              total_count = passed_count + failed_count

          if suites_match:
              suite_failed = int(suites_match.group(1) or 0)
              suite_passed = int(suites_match.group(2) or 0)
              suite_total = int(suites_match.group(3) or 0)
          else:
              suite_failed = 0
              suite_passed = 0
              suite_total = 0

          # Jest normally shows failed test names after a bullet.
          failed_test_names = []

          for line in clean_log.splitlines():
              stripped = line.strip()

              if stripped.startswith("● "):
                  failed_test_names.append(
                      stripped[2:].strip()
                  )

          if status == "PASSED":
              summary_message = (
                  "All Selenium footer tests completed successfully."
              )
          elif status == "FAILED":
              summary_message = (
                  "One or more Selenium footer tests failed. "
                  "Review the failed tests and execution log below."
              )
          else:
              summary_message = (
                  "The Selenium result could not be determined. "
                  "Review the complete execution log."
              )

          status_class = {
              "PASSED": "passed",
              "FAILED": "failed",
              "ERROR": "error",
          }.get(status, "error")

          generated_at = datetime.now(
              timezone.utc
          ).strftime("%Y-%m-%d %H:%M:%S UTC")

          failed_items = "".join(
              f"<li>{html.escape(name)}</li>"
              for name in failed_test_names
          )

          if not failed_items:
              failed_items = (
                  "<li>No individual failed test name was detected.</li>"
              )

          escaped_log = html.escape(clean_log)

          report = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">

              <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1"
              >

              <title>Realey Footer Selenium Report</title>

              <style>
                  * {{
                      box-sizing: border-box;
                  }}

                  body {{
                      margin: 0;
                      padding: 32px;
                      background: #f3f6fb;
                      color: #1f2937;
                      font-family: Arial, Helvetica, sans-serif;
                  }}

                  .container {{
                      width: 100%;
                      max-width: 1200px;
                      margin: 0 auto;
                  }}

                  .panel {{
                      padding: 26px;
                      margin-bottom: 22px;
                      background: #ffffff;
                      border-radius: 16px;
                      box-shadow:
                          0 8px 25px rgba(15, 23, 42, 0.08);
                  }}

                  h1 {{
                      margin: 0 0 8px;
                  }}

                  .muted {{
                      color: #64748b;
                  }}

                  .summary-grid {{
                      display: grid;
                      grid-template-columns:
                          repeat(5, minmax(140px, 1fr));
                      gap: 16px;
                      margin-bottom: 22px;
                  }}

                  .card {{
                      padding: 20px;
                      background: #ffffff;
                      border-radius: 14px;
                      box-shadow:
                          0 6px 20px rgba(15, 23, 42, 0.07);
                  }}

                  .label {{
                      display: block;
                      margin-bottom: 8px;
                      color: #64748b;
                      font-size: 13px;
                      font-weight: 700;
                  }}

                  .value {{
                      font-size: 25px;
                      font-weight: 800;
                  }}

                  .badge {{
                      display: inline-block;
                      padding: 8px 14px;
                      border-radius: 999px;
                      font-weight: 800;
                  }}

                  .passed {{
                      background: #dcfce7;
                      color: #166534;
                  }}

                  .failed {{
                      background: #fee2e2;
                      color: #991b1b;
                  }}

                  .error {{
                      background: #fef3c7;
                      color: #92400e;
                  }}

                  .log-panel {{
                      overflow: hidden;
                      background: #0f172a;
                      border-radius: 16px;
                      box-shadow:
                          0 8px 25px rgba(15, 23, 42, 0.14);
                  }}

                  .log-title {{
                      padding: 18px 22px;
                      background: #1e293b;
                      color: #ffffff;
                      font-weight: 800;
                  }}

                  pre {{
                      max-height: 750px;
                      padding: 24px;
                      margin: 0;
                      overflow: auto;
                      color: #dbeafe;
                      font-family:
                          Consolas,
                          Monaco,
                          monospace;
                      font-size: 13px;
                      line-height: 1.55;
                      white-space: pre-wrap;
                      overflow-wrap: anywhere;
                  }}

                  ul {{
                      margin-bottom: 0;
                      padding-left: 20px;
                  }}

                  @media (max-width: 900px) {{
                      .summary-grid {{
                          grid-template-columns: 1fr 1fr;
                      }}

                      body {{
                          padding: 16px;
                      }}
                  }}

                  @media (max-width: 480px) {{
                      .summary-grid {{
                          grid-template-columns: 1fr;
                      }}
                  }}
              </style>
          </head>

          <body>
              <main class="container">
                  <section class="panel">
                      <h1>Realey Footer Selenium Report</h1>

                      <p class="muted">
                          Generated on {generated_at}
                      </p>
                  </section>

                  <section class="summary-grid">
                      <article class="card">
                          <span class="label">
                              Overall status
                          </span>

                          <span class="badge {status_class}">
                              {html.escape(status)}
                          </span>
                      </article>

                      <article class="card">
                          <span class="label">
                              Total tests
                          </span>

                          <span class="value">
                              {total_count}
                          </span>
                      </article>

                      <article class="card">
                          <span class="label">
                              Passed
                          </span>

                          <span class="value">
                              {passed_count}
                          </span>
                      </article>

                      <article class="card">
                          <span class="label">
                              Failed
                          </span>

                          <span class="value">
                              {failed_count}
                          </span>
                      </article>

                      <article class="card">
                          <span class="label">
                              Exit code
                          </span>

                          <span class="value">
                              {html.escape(exit_code)}
                          </span>
                      </article>
                  </section>

                  <section class="panel">
                      <h2>Execution summary</h2>

                      <p>
                          {html.escape(summary_message)}
                      </p>

                      <p>
                          Suites:
                          {suite_passed} passed,
                          {suite_failed} failed,
                          {suite_total} total.
                      </p>
                  </section>

                  <section class="panel">
                      <h2>Detected failed tests</h2>

                      <ul>
                          {failed_items}
                      </ul>
                  </section>

                  <section class="log-panel">
                      <div class="log-title">
                          Complete Selenium execution log
                      </div>

                      <pre>{escaped_log}</pre>
                  </section>
              </main>
          </body>
          </html>
          """

          report_path = report_dir / "report.html"

          report_path.write_text(
              report,
              encoding="utf-8"
          )

          print(
              f"HTML report generated: {report_path}"
          )

          print(
              f"Status: {status}"
          )

          print(
              f"Tests: {passed_count} passed, "
              f"{failed_count} failed"
          )
          PYTHON

      # 11. Confirm report.html exists
      - name: Verify HTML report
        if: always()
        shell: bash
        run: |
          echo "Generated report files:"
          find html-report -maxdepth 2 -type f -print || true

          if [ ! -f "html-report/report.html" ]; then
            echo "ERROR: html-report/report.html was not generated."
            exit 1
          fi

          echo "HTML report generated successfully."

      # 12. Upload browser-friendly HTML report
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realey-footer-html-report
          path: html-report/report.html
          retention-days: 30
          if-no-files-found: error

      # 13. Upload raw console logs
      - name: Upload raw Selenium results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realey-footer-raw-results
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      # 14. Mark workflow red after reports have been uploaded
      - name: Mark workflow failed when tests fail
        if: steps.selenium.outcome == 'failure'
        shell: bash
        run: |
          echo "One or more Selenium footer tests failed."
          echo "Download realey-footer-html-report for details."
          exit 1
