name: Realey Footer Selenium Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "tests/**"
      - ".github/workflows/selenium-side.yml"

  pull_request:
    branches:
      - main

jobs:
  footer-tests:
    name: Run Footer Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Selenium SIDE Runner
        run: |
          npm init -y
          npm install --save-dev selenium-side-runner chromedriver

      - name: Create report folders
        run: |
          mkdir -p test-results
          mkdir -p html-report

      - name: Run Selenium SIDE tests
        id: selenium
        continue-on-error: true
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"

          xvfb-run -a npx selenium-side-runner \
            -w 1 \
            -c "browserName=chrome" \
            --output-directory=test-results \
            --output-format=junit \
            "tests/realey-footer.side"

      - name: Display generated result files
        if: always()
        run: |
          echo "Generated Selenium result files:"
          find test-results -type f -print || true

      - name: Generate HTML report
        if: always()
        run: |
          python3 <<'PYTHON'
          import glob
          import html
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime

          xml_files = glob.glob("test-results/**/*.xml", recursive=True)

          suites = []
          total_tests = 0
          total_failures = 0
          total_errors = 0
          total_skipped = 0
          total_time = 0.0

          for file_path in xml_files:
              try:
                  root = ET.parse(file_path).getroot()
              except Exception:
                  continue

              roots = [root] if root.tag == "testsuite" else root.findall(".//testsuite")

              for suite in roots:
                  cases = []

                  for case in suite.findall("testcase"):
                      failure = case.find("failure")
                      error = case.find("error")
                      skipped = case.find("skipped")

                      if failure is not None:
                          status = "Failed"
                          details = failure.get("message") or failure.text or "Assertion failed"
                      elif error is not None:
                          status = "Error"
                          details = error.get("message") or error.text or "Execution error"
                      elif skipped is not None:
                          status = "Skipped"
                          details = skipped.get("message") or skipped.text or ""
                      else:
                          status = "Passed"
                          details = ""

                      cases.append({
                          "name": case.get("name", "Unnamed test"),
                          "class": case.get("classname", ""),
                          "time": case.get("time", "0"),
                          "status": status,
                          "details": details.strip(),
                      })

                  tests = int(suite.get("tests", len(cases)) or 0)
                  failures = int(suite.get("failures", 0) or 0)
                  errors = int(suite.get("errors", 0) or 0)
                  skipped = int(suite.get("skipped", 0) or 0)
                  duration = float(suite.get("time", 0) or 0)

                  total_tests += tests
                  total_failures += failures
                  total_errors += errors
                  total_skipped += skipped
                  total_time += duration

                  suites.append({
                      "name": suite.get("name", "Selenium suite"),
                      "cases": cases,
                  })

          passed = max(
              total_tests - total_failures - total_errors - total_skipped,
              0
          )

          if not xml_files:
              report_message = """
              <div class="warning">
                  No JUnit XML result was generated. Review the GitHub Actions
                  Selenium execution logs.
              </div>
              """
          else:
              report_message = ""

          rows = []

          for suite in suites:
              rows.append(
                  f'<tr class="suite-row">'
                  f'<td colspan="5">{html.escape(suite["name"])}</td>'
                  f'</tr>'
              )

              for case in suite["cases"]:
                  css_status = case["status"].lower()
                  details = html.escape(case["details"])

                  rows.append(
                      "<tr>"
                      f'<td>{html.escape(case["name"])}</td>'
                      f'<td>{html.escape(case["class"])}</td>'
                      f'<td><span class="status {css_status}">'
                      f'{case["status"]}</span></td>'
                      f'<td>{html.escape(case["time"])}s</td>'
                      f'<td><pre>{details}</pre></td>'
                      "</tr>"
                  )

          report = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Realey Footer Selenium Report</title>
              <style>
                  body {{
                      margin: 0;
                      padding: 32px;
                      background: #f5f7fb;
                      color: #1f2937;
                      font-family: Arial, sans-serif;
                  }}

                  .container {{
                      max-width: 1200px;
                      margin: auto;
                  }}

                  h1 {{
                      margin-bottom: 6px;
                  }}

                  .date {{
                      color: #6b7280;
                      margin-bottom: 24px;
                  }}

                  .summary {{
                      display: grid;
                      grid-template-columns: repeat(5, minmax(130px, 1fr));
                      gap: 16px;
                      margin-bottom: 28px;
                  }}

                  .card {{
                      padding: 20px;
                      background: white;
                      border-radius: 12px;
                      box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
                  }}

                  .number {{
                      display: block;
                      margin-top: 8px;
                      font-size: 28px;
                      font-weight: bold;
                  }}

                  table {{
                      width: 100%;
                      border-collapse: collapse;
                      background: white;
                      border-radius: 12px;
                      overflow: hidden;
                      box-shadow: 0 2px 10px rgba(0, 0, 0, .06);
                  }}

                  th, td {{
                      padding: 14px;
                      border-bottom: 1px solid #e5e7eb;
                      text-align: left;
                      vertical-align: top;
                  }}

                  th {{
                      background: #111827;
                      color: white;
                  }}

                  .suite-row td {{
                      background: #eef2ff;
                      font-weight: bold;
                  }}

                  .status {{
                      display: inline-block;
                      padding: 5px 10px;
                      border-radius: 999px;
                      font-weight: bold;
                  }}

                  .passed {{
                      background: #dcfce7;
                      color: #166534;
                  }}

                  .failed, .error {{
                      background: #fee2e2;
                      color: #991b1b;
                  }}

                  .skipped {{
                      background: #fef3c7;
                      color: #92400e;
                  }}

                  pre {{
                      margin: 0;
                      white-space: pre-wrap;
                      font-family: inherit;
                  }}

                  .warning {{
                      padding: 18px;
                      margin-bottom: 20px;
                      border-radius: 10px;
                      background: #fef3c7;
                      color: #92400e;
                  }}

                  @media (max-width: 800px) {{
                      .summary {{
                          grid-template-columns: 1fr 1fr;
                      }}

                      body {{
                          padding: 16px;
                      }}
                  }}
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Realey Footer Selenium Report</h1>

                  <div class="date">
                      Generated: {datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S")} UTC
                  </div>

                  {report_message}

                  <div class="summary">
                      <div class="card">
                          Total
                          <span class="number">{total_tests}</span>
                      </div>

                      <div class="card">
                          Passed
                          <span class="number">{passed}</span>
                      </div>

                      <div class="card">
                          Failed
                          <span class="number">{total_failures}</span>
                      </div>

                      <div class="card">
                          Errors
                          <span class="number">{total_errors}</span>
                      </div>

                      <div class="card">
                          Duration
                          <span class="number">{total_time:.2f}s</span>
                      </div>
                  </div>

                  <table>
                      <thead>
                          <tr>
                              <th>Test</th>
                              <th>Suite/Class</th>
                              <th>Status</th>
                              <th>Time</th>
                              <th>Details</th>
                          </tr>
                      </thead>

                      <tbody>
                          {''.join(rows) or '<tr><td colspan="5">No test cases found.</td></tr>'}
                      </tbody>
                  </table>
              </div>
          </body>
          </html>
          """

          os.makedirs("html-report", exist_ok=True)

          with open("html-report/report.html", "w", encoding="utf-8") as file:
              file.write(report)

          print("HTML report generated: html-report/report.html")
          PYTHON

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realey-footer-html-report
          path: html-report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realey-footer-junit-results
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Mark workflow failed when tests fail
        if: steps.selenium.outcome == 'failure'
        run: |
          echo "One or more footer tests failed. Check the HTML report."
          exit 1
